version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amigo_postgres
    environment:
      POSTGRES_USER: amigo
      POSTGRES_PASSWORD: amigo_dev_pass
      POSTGRES_DB: amigo_animal
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amigo -d amigo_animal']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: amigo_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_dev_pass
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: amigo_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio_admin minio_dev_pass;
      mc mb --ignore-existing local/amigo-animal;
      mc anonymous set download local/amigo-animal/animals;
      echo 'MinIO bucket configurado com sucesso';
      "

volumes:
  postgres_data:
  minio_data:
